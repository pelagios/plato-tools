# Test, build and publish the tools to GitHub Pages (https://pelagios.org/plato-tools/).
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pinned PLATO commit
        id: plato
        run: echo "commit=$(node -p "require('./package.json').plato.commit")" >> "$GITHUB_OUTPUT"
      # The tests use PLATO's examples at the same commit the tools check against.
      - uses: actions/checkout@v4
        with:
          repository: pelagios/place-attestation-ontology
          ref: ${{ steps.plato.outputs.commit }}
          path: plato-repo
      - run: npm ci
      # librsvg's rsvg-convert and the fonts Wikimedia Commons draws a map's labels in (DejaVu Sans, Noto Sans), for
      # the test that renders a map made in Chora as Commons would (test/chora-export-rsvg.test.js): absent, it fails.
      - name: rsvg-convert and the fonts Commons has
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends librsvg2-bin fontconfig fonts-dejavu-core fonts-noto-core
      - name: Unit and conversion tests
        run: npm test
        env:
          PLATO_REPO: plato-repo
      # The tools installed as npx installs them (packed, production dependencies only, install
      # scripts run), then run: a postinstall needing a development dependency once made
      # `npx github:pelagios/plato-tools` exit 127 with nothing installed, and every test passed.
      - name: Install as npx does, and run the command
        run: node scripts/install-test.mjs
      - name: Build (vendors PLATO's files at the pinned commit)
        run: npm run build
        # Chora's CARTO basemaps: a key that only works from this site's address, built into the
        # page, where anyone can read it. Unset, the CARTO basemaps show as not yet available.
        env:
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
      # Chora's shaded relief (src/chora/relief.js): one PMTiles file of 322 MB, too large for the repository, kept as
      # the asset relief.pmtiles of the release relief-v1 and put into the site here, at basemap/relief.pmtiles,
      # checked against the sha256 committed beside it (public/basemap/relief.pmtiles.sha256): a file that differs
      # fails the build. While that release has no such asset (404), the site is built without it and says so here;
      # the relief then says, in Chora, that it is not available. Any other failure to fetch it fails the build.
      - name: Shaded relief, from the release asset, checked against its sha256
        shell: bash
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/relief-v1/relief.pmtiles"
          code=$(curl -sSL --retry 3 -o relief.pmtiles -w '%{http_code}' "$url" || true)
          if [ "$code" = 404 ]; then
            rm -f relief.pmtiles
            echo "::notice::The release relief-v1 has no asset relief.pmtiles yet: the site is built without the shaded relief, which says in Chora that it is not available."
            exit 0
          fi
          [ "$code" = 200 ] || { echo "::error::The relief could not be fetched from $url (HTTP $code)."; exit 1; }
          want=$(cut -d' ' -f1 public/basemap/relief.pmtiles.sha256)
          got=$(sha256sum relief.pmtiles | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "::error::relief.pmtiles from relief-v1 has sha256 $got, not the $want committed in public/basemap/relief.pmtiles.sha256."; exit 1; }
          mv relief.pmtiles dist/basemap/relief.pmtiles
          echo "The shaded relief is in the site: dist/basemap/relief.pmtiles, $(stat -c %s dist/basemap/relief.pmtiles) bytes, sha256 $got."
      - name: The vendored files are the pinned commit's
        run: |
          node -e "const v=require('./dist/plato/VERSION.json'), p=require('./package.json'); if (v.commit !== p.plato.commit) { console.error('vendored', v.commit, 'pinned', p.plato.commit); process.exit(1) }"
          cmp dist/plato/ontology.ttl plato-repo/ontology.ttl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
